server:
  port: 8080

#数据库连接配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blog?createDatabaseIfNotExist=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: your_redis_host
      port: 6379

  mail:
    host: smtp.qq.com
    port: 587
    username: yours-email@example.com
    password: yours-password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

flyway:
  enabled: true
  locations: classpath:db/migration
#    baseline-on-migrate: true # 防止 flyway 第一次启动时有表而报错

# mybatis 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.blog.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: your_jwt_secret
  access-token-expire: 900000
  refresh-token-expire: 604800000
