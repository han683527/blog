# 用 Accept 头区分"浏览器页面导航"(返回 SPA)和"接口请求"(代理给后端)
# 解决 /article/:id、/user/:id 等 SPA 路由与后端接口路径冲突,刷新页面不再显示 JSON
map $http_accept $backend_route {
    default 1;
    ~*text/html 0;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 history 路由:找不到的路径全部回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的静态资源永不变化,长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # index.html 不缓存,保证发新版本后浏览器能立即拿到新的页面引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # POST/PUT /article(创建/修改文章)是裸路径没有斜杠,下面 regex 匹配不到,单独精确反代
    location = /article {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /comment {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端接口 + 上传图片统一反代
    location ~ ^/(auth|admin|article|comment|like|collect|user|category|tag|notification|upload)/ {
        # 浏览器页面导航(Accept 含 text/html)回退到 SPA,避免详情页/用户页刷新显示 JSON
        if ($backend_route = 0) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 实时通知:必须关闭缓冲,否则 EventSource 收不到推送
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_cache off;
    }
}

# ============ 管理后台(独立端口 8092,与主站互不影响)============
# 管理后台 API 只有 /auth /admin /user 三个前缀,页面路由(/login /users /articles ...)
# 都带不上这些前缀,所以用最长前缀匹配区分,不需要 Accept 头判断
server {
    listen 8092;
    server_name _;

    root /usr/share/nginx/html-admin;
    index index.html;

    # 后端接口统一反代(admin SPA 的 axios baseURL 是 /,同源调用)
    # Host 用 $http_host 保留端口,否则后端 isCorsRequest 会把 8092 请求误判为跨域 403
    location ~ ^/(auth|admin|user)/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带内容哈希的静态资源永不变化,长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # index.html 不缓存
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 管理后台 history 路由:找不到的路径全部回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
